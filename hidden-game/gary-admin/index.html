<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Game Control</title><style>body{font-family:system-ui;background:#151018;color:#fff;margin:0;padding:20px}.wrap{max-width:700px;margin:auto}.card{background:#261d2a;padding:16px;border-radius:16px;margin:12px 0}input,textarea,select,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #58435e;font:inherit}button{background:#c95586;color:white;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#cbbdce;font-size:13px}.danger{background:#673243}</style></head><body><main class="wrap"><h1>🎮 Game Control</h1><p class="muted">Private prize editor. Changes are stored on this device and exported to the game prize file when you publish them.</p><div class="card"><input id="pin" type="password" placeholder="Admin PIN"><button onclick="unlock()">Unlock</button><div id="msg" class="muted"></div></div><section id="panel" hidden><div class="card"><h2>Add prize</h2><input id="name" placeholder="Prize name"><textarea id="text" placeholder="What Jo wins"></textarea><select id="type"><option value="normal">Normal prize</option><option value="dark">After Dark jackpot</option></select><button onclick="add()">Add prize</button></div><div id="list"></div><div class="card"><button onclick="exportPrizes()">Export prize list</button><button class="danger" onclick="resetDefaults()">Restore defaults</button></div></section></main><script src="admin.js"></script></body></html>
