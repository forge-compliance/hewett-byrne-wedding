<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Game Control</title><style>body{font-family:system-ui;background:#151018;color:#fff;margin:0;padding:20px}.wrap{max-width:700px;margin:auto}.card{background:#261d2a;padding:16px;border-radius:16px;margin:12px 0}input,textarea,select,button{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #58435e;font:inherit}button{background:#c95586;color:#fff;font-weight:700}.muted{color:#cbbdce;font-size:13px}.danger{background:#673243}</style></head><body><main class="wrap"><h1>🎮 Game Control</h1><p class="muted">Private prize editor</p><div class="card" id="login"><input id="pin" type="password" inputmode="numeric" placeholder="Admin PIN"><button id="unlockBtn" type="button">Unlock</button><div id="msg" class="muted"></div></div><section id="panel" hidden><div class="card"><h2>Add prize</h2><input id="prizeName" placeholder="Prize name"><textarea id="prizeText" placeholder="What Jo wins"></textarea><select id="prizeType"><option value="normal">Normal prize</option><option value="dark">After Dark jackpot</option></select><button id="addBtn" type="button">Add prize</button><div id="status" class="muted"></div></div><div id="list"></div><div class="card"><button id="resetBtn" class="danger" type="button">Restore defaults</button></div></section></main><script>const D=[{name:"Proper Kiss",text:"A long lingering kiss from Gary.",type:"normal"},{name:"Naughty Massage",text:"A private massage with the mood chosen by Jo.",type:"normal"},{name:"You Choose Tonight",text:"Jo chooses the romantic plan for the evening.",type:"normal"},{name:"Secret Request",text:"Jo can make one private mutually-agreed request.",type:"normal"},{name:"After Dark Jackpot",text:"A special private reward you both agree on together.",type:"dark"}];let P;try{P=JSON.parse(localStorage.getItem("joAdminPrizes"))||D}catch(e){P=D}const E=x=>document.getElementById(x);function save(){try{localStorage.setItem("joAdminPrizes",JSON.stringify(P))}catch(e){}render()}function render(){E("list").innerHTML="";P.forEach((p,i)=>{let d=document.createElement("div");d.className="card";let h=document.createElement("h3");h.textContent=(p.type==="dark"?"🔥 ":"🎁 ")+p.name;let q=document.createElement("p");q.textContent=p.text;let b=document.createElement("button");b.type="button";b.className="danger";b.textContent="Delete";b.addEventListener("click",()=>{P.splice(i,1);save()});d.append(h,q,b);E("list").appendChild(d)})}E("unlockBtn").addEventListener("click",()=>{if(E("pin").value==="2707"){E("login").hidden=true;E("panel").hidden=false;render()}else E("msg").textContent="Wrong PIN"});E("addBtn").addEventListener("click",()=>{let n=E("prizeName").value.trim(),t=E("prizeText").value.trim(),y=E("prizeType").value;if(!n){E("status").textContent="Enter a prize name first.";return}P.push({name:n,text:t,type:y});save();E("prizeName").value="";E("prizeText").value="";E("status").textContent="✓ Prize added: "+n});E("resetBtn").addEventListener("click",()=>{P=D.map(x=>({...x}));save()});</script></body></html>
