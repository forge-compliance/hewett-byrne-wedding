<header class="hero small"><div><div class="eyebrow">Please reply</div><h1>RS<span class="amp">VP</span></h1><p>Please submit one form per household and include every invited guest.</p></div></header>
<main><section class="section"><div class="card">
<!-- Replace YOUR_FORM_ID with your Formspree form ID before sending invitations -->
<form id="wedding-rsvp" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">
<input type="hidden" name="_subject" value="New Hewett-Byrne Wedding RSVP">
<input type="hidden" name="_next" value="https://hewett-byrne-wedding.co.uk/thanks.html">
<div class="form-grid">
<div class="field"><label for="lead">Lead guest name</label><input id="lead" name="lead_guest" required></div>
<div class="field"><label for="email">Email address</label><input id="email" type="email" name="email" required></div>
<div class="field full"><label for="guests">Names of all invited guests in your party</label><textarea id="guests" name="guest_names" required></textarea></div>
<div class="field"><label for="attending">Will you attend?</label><select id="attending" name="attending" required><option value="">Please choose</option><option>Joyfully accepts</option><option>Regretfully declines</option></select></div>

<div class="field full"><label for="diet">Dietary requirements and allergies</label><textarea id="diet" name="dietary_requirements"></textarea></div>
<div class="field full"><label for="access">Accessibility or other requirements</label><textarea id="access" name="accessibility"></textarea></div>
<div class="field"><label for="song">One song that gets you dancing</label><input id="song" name="song_request"></div>
<div class="field"><label for="transport">Transport interest</label><select id="transport" name="transport_interest"><option>No transport needed</option><option>Interested in shared transport</option><option>Need more information</option></select></div>
<div class="field full"><label for="message">Message for Gary and Jo</label><textarea id="message" name="message"></textarea></div>
<div class="field full"><button class="btn" type="submit">Send RSVP</button></div>
</div></form></div>

</section></main>
<footer class="footer"><b>Gary & Jo</b><br>
<span class="small">hewett-byrne-wedding.co.uk · Buckler's Hard · 2027</span></footer>
<script src="assets/script.js"></script>
</body></html>
